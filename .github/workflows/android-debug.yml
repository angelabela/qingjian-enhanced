# 只构建 Android Debug APK；用于功能分支快速验证，不启动桌面平台构建。
name: android-debug

on:
  # APK 只在代码推送时构建；237 基线的实时信息功能与输入手势样式在此工作流验证。
  push:
    branches: [feature/smart-input-android-0.7, feature/clipboard-preview-shift-icons, feature/spacebar-clipboard-phrase-memory-toolbar, feature/android-ai-chat-assistant, fix/android-voice-animation-stutter, fix/voice-animation-frame-pacing, feature/android-input-efficiency-phase1, feature/run234-voice-gestures-smart-candidates, feature/run236-memory-voice-cloud, feature/run237-smart-context]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    env:
      NDK_VERSION: 29.0.13599879
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Use JDK 21
        run: |
          if [[ ! -d "${JAVA_HOME_21_X64:-}" ]]; then
            echo "runner 上没有 JDK 21（JAVA_HOME_21_X64）" >&2
            ls /usr/lib/jvm >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      - name: Install NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" > /dev/null
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Test Android core and smart completions
        # Workspace cleanup changes the resolved workspace package set; let Cargo refresh Cargo.lock.
        run: cargo test -p qingjian-android

      - name: Fetch and verify full dictionary data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          test -s data/generated/dict.qj
          test -d data/generated/dicts
          find data/generated/dicts -type f -name '*.qj' -size +0c | grep -q .
          ls -lh data/generated/dict.qj data/generated/lm.qj data/generated/dicts

      - name: Build Android debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qingjian-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
