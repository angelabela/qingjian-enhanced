name: Prepare zh.ngram model
on:
  push:
    paths:
      - ".github/workflows/prepare-ngram-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download the two Release parts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p parts output
          gh release download ngram-upload-20261121 \
            --repo "$GH_REPO" \
            --pattern 'zhiyi-v1.0.0.tar.gz.part*' \
            --dir parts

      - name: Verify, merge and extract zh.ngram
        shell: bash
        run: |
          set -euo pipefail
          cd parts
          echo "8cc72d636aea2e8c5d570a5d24c5cb252e317a95e3eb291ffcea45c7ce3f7182  zhiyi-v1.0.0.tar.gz.part1" | sha256sum -c -
          echo "f2e2e11fd3c3ce40612d88021fbe43537ccdf8c809ba89e69d2fb5c54d305510  zhiyi-v1.0.0.tar.gz.part2" | sha256sum -c -
          cat zhiyi-v1.0.0.tar.gz.part1 zhiyi-v1.0.0.tar.gz.part2 > ../model.tar.gz
          cd ..
          python3 - <<'PY'
          import tarfile, pathlib, sys
          archive = pathlib.Path("model.tar.gz")
          out = pathlib.Path("output/zh.ngram")
          with tarfile.open(archive, "r:gz") as tf:
              matches = [m for m in tf.getmembers()
                         if pathlib.PurePosixPath(m.name).name == "zh.ngram"
                         and m.isfile()]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one regular zh.ngram, found {len(matches)}")
              src = tf.extractfile(matches[0])
              if src is None:
                  raise SystemExit("Could not read zh.ngram")
              with out.open("wb") as dst:
                  while True:
                      chunk = src.read(8 * 1024 * 1024)
                      if not chunk:
                          break
                      dst.write(chunk)
          data = out.open("rb")
          magic = data.read(8)
          header = data.read(16)
          data.close()
          if magic != b"ZYNGRAM1" or len(header) != 16:
              raise SystemExit("zh.ngram magic/header validation failed")
          import struct
          n1, n2, n3, reserved = struct.unpack("<IIII", header)
          if reserved != 0 or not (n1 > 0 and n2 > 0 and n3 > 0):
              raise SystemExit(f"Invalid zh.ngram header: {n1}, {n2}, {n3}, reserved={reserved}")
          print(f"Validated zh.ngram: {out.stat().st_size} bytes; counts={n1},{n2},{n3}")
          PY

      - name: Upload processed model
        uses: actions/upload-artifact@v4
        with:
          name: zh-ngram-import
          path: output/zh.ngram
          if-no-files-found: error
          retention-days: 7
