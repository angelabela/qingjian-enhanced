# Android-only CI: build and upload the installable debug APK.
# Desktop/Linux platform checks are intentionally excluded from pull-request CI
# to keep Android iteration fast. Their source code and release workflows remain intact.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android debug APK
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      NDK_VERSION: 29.0.13599879
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.96.0
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Gradle 8.14 supports JDK 21; explicitly select it on the GitHub runner.
      - name: Use JDK 21
        run: |
          if [[ ! -d "${JAVA_HOME_21_X64:-}" ]]; then
            echo "runner 上没有 JDK 21（JAVA_HOME_21_X64）：" >&2
            ls /usr/lib/jvm >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # Keep the full production dictionary; never build with the sample dictionary.
      - name: Fetch and verify full dictionary data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tools/release/data-fetch.sh
          test -s data/generated/dict.qj
          test -d data/generated/dicts
          find data/generated/dicts -type f -name '*.qj' -size +0c | grep -q .
          ls -lh data/generated/dict.qj data/generated/lm.qj data/generated/dicts

      - name: Install NDK and cargo-ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-36" > /dev/null
          cargo install cargo-ndk --version 4.1.2 --locked
          echo "sdk.dir=$ANDROID_HOME" > apps/android/local.properties

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qingjian-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
